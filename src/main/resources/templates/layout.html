<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F0587E">
  <title th:text="${title}">Scoopy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header th:fragment="top" class="top">
  <a class="logo" th:href="@{/}">Scoopy<span>🍦</span></a>
  <form class="search" th:action="@{/}" method="get">
    <input name="q" th:value="${q}" placeholder="Search ice creams" aria-label="Search ice creams">
  </form>
  <a class="cartlink" th:href="@{/cart}" aria-label="Cart">🛒<b id="cart-badge" th:text="${cart.count()}" th:hidden="${cart.count() == 0}">0</b></a>
</header>
<nav th:fragment="bottom" class="bottom">
  <a th:href="@{/}">🏠<small>Shop</small></a>
  <a th:href="@{/(cat='Tubs')}">🥣<small>Tubs</small></a>
  <a th:href="@{/(cat='Cones')}">🍦<small>Cones</small></a>
  <a th:href="@{/cart}">🛒<small>Cart</small></a>
</nav>
</body>
</html>
